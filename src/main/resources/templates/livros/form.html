<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Cadastrar Livro</title>
</head>
<body>
<h1>Cadastrar livro</h1>

<form th:action="@{/livros}" th:object="${livro}" method="post">
    <label>Título:</label>
    <input type="text" th:field="*{titulo}"><br><br>
    <label>Autor:</label>
    <input type="text" th:field="*{autor}"><br><br>

    <label>ISBN:</label>
    <input type="text" th:field="*{isbn}"><br><br>
    <button type="submit">Cadastrar</button>
</form>
<br>
<a th:href="@{/livros}">Ver lista de livros</a>
</body>
</html>
